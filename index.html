<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ | สมาคมฌาปนกิจสงเคราะห์</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <!-- Select2 -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-card shadow-lg">
      <div class="row g-0">
        <!-- Left: Brand -->
        <div class="col-lg-6 d-none d-lg-flex brand-side">
          <div class="brand-content text-center">
            <div class="brand-icon mb-4">
              <i class="fas fa-hands-holding-heart"></i>
            </div>
            <h2 class="brand-title">สมาคมฌาปนกิจสงเคราะห์</h2>
            <p class="brand-subtitle">Funeral Assistance Association</p>
            <p class="brand-desc">ระบบบริหารจัดการสมาชิกมาตรฐานสากล</p>
          </div>
        </div>

        <!-- Right: Form -->
        <div class="col-lg-6">
          <div class="login-form p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="brand-icon-sm d-lg-none mb-3">
                <i class="fas fa-hands-holding-heart"></i>
              </div>
              <h3 class="fw-bold">ยินดีต้อนรับ</h3>
              <p class="text-muted">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
              <div class="mb-3">
                <label class="form-label fw-semibold">
                  <i class="fas fa-user me-2"></i>ชื่อผู้ใช้
                </label>
                <input type="text" class="form-control form-control-lg" 
                       id="username" placeholder="กรอกชื่อผู้ใช้" required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-semibold">
                  <i class="fas fa-lock me-2"></i>รหัสผ่าน
                </label>
                <div class="input-group">
                  <input type="password" class="form-control form-control-lg" 
                         id="password" placeholder="กรอกรหัสผ่าน" required>
                  <button class="btn btn-outline-secondary" type="button" 
                          onclick="togglePassword()">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                  </button>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">
                    จดจำการเข้าสู่ระบบ
                  </label>
                </div>
                <a href="#" class="text-decoration-none">ลืมรหัสผ่าน?</a>
              </div>

              <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                <i class="fas fa-sign-in-alt me-2"></i>เข้าสู่ระบบ
              </button>

              <div class="text-center mt-3">
                <small class="text-muted">
                  Demo: admin / admin123
                </small>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-4 text-white-50">
      <small>&copy; 2026 Funeral Assistance Association. All Rights Reserved.</small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u === 'admin' && p === 'admin123') {
        window.location.href = 'dashboard.html';
      } else {
        alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      }
    }
  </script>
</body>
</html>
